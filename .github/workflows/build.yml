name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build
        run: |
          flutter create --project-name shiro_v32 --platforms=android temp
          cp temp/android -r ./android 2>/dev/null || cp -r temp/android .
          cp lib/main.dart temp/lib/main.dart
          cp pubspec.yaml temp/pubspec.yaml
          cd temp
          flutter pub get
          flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHIRO-v32-APK
          path: temp/build/app/outputs/flutter-apk/app-debug.apk
