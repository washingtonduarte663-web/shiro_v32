name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Create app
        run: flutter create --project-name shiro_v32 app --platforms=android
      - name: Make main.dart
        run: |
          cat > app/lib/main.dart << 'ENDDART'
          import 'package:flutter/material.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          void main() => runApp(MaterialApp(home: Shiro()));
          class Shiro extends StatefulWidget { @override State<Shiro> createState() => _S(); }
          class _S extends State<Shiro> {
            final tts = FlutterTts();
            @override Widget build(BuildContext context){
              return Scaffold(backgroundColor: Colors.black, body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[
                Icon(Icons.smart_toy, size: 100, color: Colors.cyan),
                Text("SHIRO v3.2", style: TextStyle(color: Colors.cyan, fontSize: 32)),
                SizedBox(height: 20),
                ElevatedButton(onPressed: (){ tts.speak("SHIRO v3.2 pronto Washington!"); }, child: Text("FALAR"))
              ])));
            }
          }
          ENDDART
      - run: cd app && flutter pub add flutter_tts && flutter pub get
      - run: cd app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SHIRO-v32-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
